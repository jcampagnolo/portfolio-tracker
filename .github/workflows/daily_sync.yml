name: Sincronização Diária de Dados

on:
  schedule:
    # Roda diariamente às 06:00 UTC (03:00 Horário de Brasília)
    - cron: '0 6 * * *'
  # Permite disparar manualmente pelo painel do GitHub para testes
  workflow_dispatch:

jobs:
  run-python-collector:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas supabase

      - name: Executar Coletor de Dividendos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python -m src.collectors.dividends_fetcher